# Lefthook configuration for UAsset Viewer
# https://github.com/evilmartians/lefthook

# Pre-commit hooks run before each commit
pre-commit:
  parallel: true
  commands:
    dotnet-build:
      glob: "*.cs"
      exclude:
        - "UAssetAPI/**"
        - "UAssetGUI/**"
      run: |
        if [ -n "{staged_files}" ]; then
          mkdir -p .launcher-state/hooks/dotnet
          DOTNET_CLI_HOME=.launcher-state/hooks/dotnet DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 dotnet build godot/UAssetViewer.csproj --no-restore
        fi

    frontend-check:
      glob: "svelte-ui/src/**/*.{ts,svelte}"
      root: "svelte-ui/"
      run: npm run check

    frontend-typecheck:
      glob: "svelte-ui/src/**/*.{ts,svelte}"
      root: "svelte-ui/"
      run: npx tsc --noEmit

    readme-check:
      run: ./scripts/validate-readmes.sh

# Pre-push hooks run before pushing to remote
pre-push:
  parallel: false
  commands:
    tests:
      run: ./launcher.sh --test

# Commit message validation
commit-msg:
  commands:
    # Validate conventional commit format
    conventional-commit:
      run: |
        MSG=$(cat "$1")

        if ! echo "$MSG" | grep -qE "^(feat|fix|refactor|chore|docs|style|test|perf|ci)(\([a-z-]+\))?: .+"; then
          echo "ERROR: Commit message does not follow Conventional Commits format."
          echo "Expected: <type>(<scope>): <description>"
          echo "Types: feat, fix, refactor, chore, docs, style, test, perf, ci"
          echo "Example: fix(ui): align viewport state contract"
          exit 1
        fi

        if ! echo "$MSG" | grep -qE "Agent: .+"; then
          echo "WARNING: Commit message missing Agent footer."
          echo "Expected: Agent: <name>"
        fi
