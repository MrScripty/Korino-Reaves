name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: svelte-ui/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          cd svelte-ui
          npm ci --legacy-peer-deps

      - name: Restore .NET dependencies
        run: |
          dotnet restore godot/UAssetViewer.csproj
          dotnet restore godot/tests/UAssetViewer.Tests.csproj

      - name: Verify frontend
        run: |
          cd svelte-ui
          npm run check
          npx tsc --noEmit

      - name: Build Rust runtime crates
        run: |
          cargo build --manifest-path cef-gdext/Cargo.toml --locked
          cargo build --manifest-path cef-helper-rs/Cargo.toml --locked

      - name: Build .NET solution
        run: dotnet build UAssetViewer.slnx --configuration Debug --no-restore

      - name: Run .NET tests
        run: dotnet test godot/tests/UAssetViewer.Tests.csproj --no-restore
